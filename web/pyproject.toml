[project]
name = "accounting-web"
version = "1.0.0"
description = "個人記帳簿 Web 唯讀查詢系統"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.111.0",
    "uvicorn[standard]>=0.29.0",
    "jinja2>=3.1.4",
    "openpyxl>=3.1.0",
    "python-multipart>=0.0.9",
]

[project.scripts]
web = "web.app:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.uv]
dev-dependencies = []
